<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitFarm - Виртуальный Майнинг</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0a0a1a;
            color: #00ff00;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #00ff00;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .balance {
            font-size: 18px;
        }
        
        .counter {
            font-size: 36px;
            text-align: center;
            margin: 40px 0;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }
        
        .mining-farms {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .farm {
            background-color: #111122;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            transition: transform 0.3s;
        }
        
        .farm:hover {
            transform: scale(1.03);
        }
        
        .farm-name {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .farm-hashrate {
            color: #00cc00;
            margin-bottom: 15px;
        }
        
        .farm-price {
            margin-bottom: 15px;
        }
        
        .buy-btn {
            background-color: #00aa00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        .buy-btn:hover {
            background-color: #00cc00;
        }
        
        .owned {
            margin-top: 10px;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">BitFarm</div>
            <div class="user-info">
                <div class="balance">Баланс: <span id="userBalance">0</span> BTC</div>
                <button class="buy-btn" onclick="claim()">Забрать</button>
            </div>
        </header>
        
        <div class="counter" id="miningCounter">0.00000000 BTC</div>
        
        <div class="mining-farms">
            <div class="farm">
                <div class="farm-name">Базовый майнер</div>
                <div class="farm-hashrate">Хешрейт: 10 H/s</div>
                <div class="farm-price">Цена: 1 BTC</div>
                <button class="buy-btn" onclick="buyFarm(0)">Купить</button>
                <div class="owned">Куплено: <span id="farm0">0</span></div>
            </div>
            
            <div class="farm">
                <div class="farm-name">Продвинутый майнер</div>
                <div class="farm-hashrate">Хешрейт: 50 H/s</div>
                <div class="farm-price">Цена: 5 BTC</div>
                <button class="buy-btn" onclick="buyFarm(1)">Купить</button>
                <div class="owned">Куплено: <span id="farm1">0</span></div>
            </div>
            
            <div class="farm">
                <div class="farm-name">Профессиональная ферма</div>
                <div class="farm-hashrate">Хешрейт: 200 H/s</div>
                <div class="farm-price">Цена: 20 BTC</div>
                <button class="buy-btn" onclick="buyFarm(2)">Купить</button>
                <div class="owned">Куплено: <span id="farm2">0</span></div>
            </div>
            
            <div class="farm">
                <div class="farm-name">Промышленная ферма</div>
                <div class="farm-hashrate">Хешрейт: 1000 H/s</div>
                <div class="farm-price">Цена: 100 BTC</div>
                <button class="buy-btn" onclick="buyFarm(3)">Купить</button>
                <div class="owned">Куплено: <span id="farm3">0</span></div>
            </div>
        </div>
    </div>

    <script>
        // Игровые данные
        let balance = 0;
        let mined = 0;
        let farms = [
            { price: 1, hashrate: 10, owned: 0 },
            { price: 5, hashrate: 50, owned: 0 },
            { price: 20, hashrate: 200, owned: 0 },
            { price: 100, hashrate: 1000, owned: 0 }
        ];
        
        // Общий хешрейт
        function getTotalHashrate() {
            let total = 0;
            farms.forEach((farm, index) => {
                total += farm.hashrate * farm.owned;
            });
            return total;
        }
        
        // Покупка фермы
        function buyFarm(index) {
            if (balance >= farms[index].price) {
                balance -= farms[index].price;
                farms[index].owned++;
                updateUI();
            } else {
                alert("Недостаточно средств!");
            }
        }
        
        // Забрать добытые BTC
        function claim() {
            balance += mined;
            mined = 0;
            updateUI();
        }
        
        // Обновление интерфейса
        function updateUI() {
            document.getElementById('userBalance').textContent = balance.toFixed(8);
            
            for (let i = 0; i < farms.length; i++) {
                document.getElementById(`farm${i}`).textContent = farms[i].owned;
            }
        }
        
        // Анимация счетчика
        function updateCounter() {
            // Добавляем случайное значение в зависимости от хешрейта
            const hashrate = getTotalHashrate();
            const miningAmount = hashrate / 100000 * Math.random();
            mined += miningAmount;
            
            // Форматируем число с 8 знаками после запятой
            let counterValue = mined.toFixed(8);
            
            // Добавляем случайные колебания к последним цифрам
            if (hashrate > 0) {
                const counterStr = counterValue.split('');
                for (let i = 6; i < counterStr.length; i++) {
                    if (Math.random() > 0.7) {
                        counterStr[i] = Math.floor(Math.random() * 10);
                    }
                }
                counterValue = counterStr.join('');
            }
            
            document.getElementById('miningCounter').textContent = counterValue + " BTC";
        }
        
        // Запуск игры
        function init() {
            updateUI();
            setInterval(updateCounter, 50);
            
            // Добавляем немного начальных средств для демонстрации
            balance = 10;
            updateUI();
        }
        
        // Запускаем при загрузке страницы
        window.onload = init;
    </script>
</body>
</html>
